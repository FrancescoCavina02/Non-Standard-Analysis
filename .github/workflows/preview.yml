name: Preview review pull requests

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    if: startsWith(github.head_ref, 'generated/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        if: github.event.action != 'closed'
        uses: actions/checkout@v4

      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Validate review branch
        if: github.event.action != 'closed'
        run: npm run check

      - name: Build preview
        if: github.event.action != 'closed'
        run: npm run build
        env:
          BASE_PATH: /Non-Standard-Analysis/pr-preview/pr-${{ github.event.pull_request.number }}

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          action: auto
          qr-code: false
          wait-for-pages-deployment: true
