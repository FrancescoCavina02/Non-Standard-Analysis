name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate website
        run: npm run check

      - name: Build website
        run: npm run build
        env:
          BASE_PATH: /Non-Standard-Analysis

      - name: Deploy production while preserving previews
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
